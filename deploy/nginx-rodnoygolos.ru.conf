# Корпоративный домен rodnoygolos.ru (редакция B2B).
#
# Лежит в репозитории, а не вставляется в терминал руками: при вставке
# большого конфига zsh экранирует точку с запятой после URL
# (http://127.0.0.1:8000\;), и proxy_pass молча ломается — nginx -t при
# этом проходит, потому что синтаксис формально верный.
#
# Установка:
#   cp deploy/nginx-rodnoygolos.ru.conf /etc/nginx/sites-available/rodnoygolos.ru
#   ln -sf /etc/nginx/sites-available/rodnoygolos.ru /etc/nginx/sites-enabled/
#   certbot --nginx -d rodnoygolos.ru -d www.rodnoygolos.ru --non-interactive --agree-tos --redirect
#   nginx -t && systemctl reload nginx
#
# ВАЖНО: nginx.conf подключает sites-enabled ПОИМЁННО, а не маской *.
# Одного симлинка мало — рядом с include для rodnyegolosa.ru должна быть
# строка и для этого домена, иначе конфиг просто не читается, а nginx -t
# при этом проходит (он проверяет то, что подключено).
#
# ВАЖНО-2: этот файл — только HTTP. Блок на 443 дописывает certbot прямо
# в /etc/nginx/sites-available/rodnoygolos.ru. Значит, повторное
# копирование отсюда СОТРЁТ настройки SSL. После каждого cp нужно снова
# прогнать certbot той же командой — он переустановит уже выпущенный
# сертификат, заново его не запрашивая.

server {
    listen 80;
    listen [::]:80;

    server_name rodnoygolos.ru www.rodnoygolos.ru;

    # Лендинги собираются вместе: dist/index.html — B2C, dist/b2b.html — B2B.
    root /var/www/rodnyegolosa.ru/mumisnearby/dist;

    # Главная этого домена — корпоративный лендинг.
    location = / {
        try_files /b2b.html =404;
    }

    # Ассеты отдаём как есть, всё остальное — на b2b.html.
    location / {
        try_files $uri $uri/ /b2b.html;
    }

    # Личный кабинет: СВОЯ сборка редакции.
    #
    # dist/lk — это B2C-кабинет, он копируется туда корневым npm run build.
    # Здесь нужен dist-b2b, иначе на корпоративном домене открылся бы
    # кабинет для частных клиентов: с оплатой, бонусами и конструктором.
    #
    # ^~ ОБЯЗАТЕЛЕН. Без него регулярка кеширования статики в конце файла
    # перехватывает .js и .css (regex-локации приоритетнее префиксных), и
    # скрипты кабинета начинают искаться в dist/lk — то есть в B2C-сборке.
    # Снаружи это выглядит как пустой белый экран: index.html приходит из
    # dist-b2b и просит свой бандл, а тот отдаёт 404.
    location ^~ /lk/ {
        alias /var/www/rodnyegolosa.ru/mumisnearby/lk/dist-b2b/;
        try_files $uri $uri/ /lk/index.html;
    }

    # ── API ─────────────────────────────────────────────────────────
    # Префиксы перечислены поимённо, потому что корень отдаёт статику.
    # Набор должен совпадать с основным доменом. Новый здесь один —
    # companies: это кабинет юрлица (/companies/auth/login, /companies/
    # staff, /companies/slots). Админка юрлиц живёт под уже
    # проксируемым /admin/companies.
    location ~ ^/(api|auth|voices|generations|subscription|support|admin|super_admin|companies|leads|notifications|referral|profile)(/|$) {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Поток уведомлений (SSE).
    #
    # Точное совпадение бьёт регулярку выше независимо от порядка.
    # Буферизацию и кеш обязательно выключить: иначе nginx копит ответ у
    # себя и колокольчик не обновляется, пока соединение не закроется.
    location = /notifications/stream {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # Статику кешируем надолго: имена файлов содержат хеш сборки,
    # поэтому новая версия приезжает под новым именем.
    location ~* \.(?:css|js|woff2?|png|jpe?g|svg|mp4|mov|mp3)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
